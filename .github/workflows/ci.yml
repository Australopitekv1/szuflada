name: CI

on:
  push:
    branches: [main, claude/receipt-document-app-ycempn]
  pull_request:

jobs:
  protocol:
    name: Protocol (TS) — typecheck + testy + spójność wektorów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Wektory i fixture'y w repo muszą być dokładnie tym, co produkują
      # generatory — ręczna edycja plików bez zmiany generatora = fail.
      - name: Wektory i fixture'y zgodne z generatorami
        run: |
          pnpm --filter @szuflada/protocol gen:vectors
          pnpm --filter @szuflada/protocol gen:fixtures
          git diff --exit-code packages/protocol/test-vectors/ packages/protocol/test-fixtures/

  relay:
    name: Relay (Go) — vet + testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/relay/go.mod
      - name: gofmt
        working-directory: apps/relay
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: apps/relay
        run: go vet ./...
      - name: go test
        working-directory: apps/relay
        run: go test ./...

  android:
    name: Android — testy JVM + build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Testy JVM (parser + konformancja protokołu) i build :app
        working-directory: apps/android
        run: gradle test :app:assembleDebug --console=plain

  crypto-jvm:
    name: Spike krypto (JVM / lazysodium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Testy wektorów przez lazysodium
        working-directory: spikes/crypto-jvm
        run: gradle test --console=plain
